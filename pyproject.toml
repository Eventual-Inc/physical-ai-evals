[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-ai-evals"
version = "0.1.0"
description = "Tools for querying robot datasets and evaluating VLA policies on LIBERO."
readme = "README.md"
# Python 3.12 is the only runtime exercised by CI and both GPU images. Broaden this
# only after adding a green version matrix.
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Eventual" }]
keywords = ["robotics", "vla", "libero", "evaluation", "benchmark", "daft", "physical-ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core stays lightweight (schema / writer / ingest base). Everything heavy — policies, sim,
# dataset readers — is an optional extra so the package imports and tests run on a CPU box.
dependencies = [
  "daft[huggingface, hdf5, video]>=0.7.21",      # Hdf5File.read + daft.datasets.{lerobot,droid}
  "pydantic>=2.7",     # Episode/Step + rollout config models
  "imageio[ffmpeg]>=2.34",  # mp4 rollout video capture
]

[project.urls]
Homepage = "https://eventual-inc.github.io/physical-ai-evals/"
Documentation = "https://eventual-inc.github.io/physical-ai-evals/"
Repository = "https://github.com/Eventual-Inc/physical-ai-evals"
Issues = "https://github.com/Eventual-Inc/physical-ai-evals/issues"

[project.optional-dependencies]
embed = [
  "daft[transformers]>=0.7.21",  # text/image embeddings via daft.functions.ai.embed_*
]
libero = [
  "hf-libero>=0.1.4; sys_platform == 'linux'",
]


# OpenVLA's transformers pin conflicts with VLA-JEPA's stack — the two policies need
# separate envs/images. flash-attn is intentionally NOT listed: its sdist needs torch at
# build time, which breaks `uv lock` and fresh-env pip installs alike. The policy runs on
# sdpa; if you want flash-attn, install it manually afterwards:
#   pip install flash-attn==2.5.5 --no-build-isolation
openvla = [
  "torch==2.2.0",          # Python support is intentionally scoped to the tested 3.12 runtime
  "numpy>=1.24,<2.0",      # torch 2.2 is numpy-1.x-compiled (_ARRAY_API crash on 2.x)
  "transformers==4.40.1",  # newer transformers silently breaks remote predict_action
  "tokenizers==0.19.1",
  "timm==0.9.10",
  "accelerate>=0.25.0",
  "pillow>=10.0",          # OpenVLA processor builds PIL.Image from the frame
]


# Deliberately empty: lerobot is a git dep whose marker-conditional torch pins make uv's
# universal lock unsatisfiable, so the Modal image
# (physical_ai_evals/modal_vla_jepa_app.py)
# is the canonical install path. On a linux GPU box (requires Python >=3.12):
#   pip install "lerobot[vla_jepa] @ git+https://github.com/huggingface/lerobot@052d329470ea8d5c98a4b4bd1f6c18abd0ac7c34"
vla_jepa = []
ingest_hdf5 = ["daft[hdf5]>=0.7.21"]  # robomimic/LIBERO demo ingest
modal = ["modal>=0.64"]        # deployment only


# Torch is installed from the CPU index by `make setup`/CI so contributors do not
# accidentally resolve a CUDA wheel on development machines.
dev = ["pytest>=8.0"]

[project.scripts]
physical-ai-evals = "physical_ai_evals.cli:main"

[dependency-groups]
# uv installs this group by default. Policy-adapter tests additionally need the CPU
# Torch wheel installed by `make setup`.
dev = ["pytest>=8.0", "h5py>=3.10", "pillow>=10.0"]

[tool.uv]
exclude-newer = "7 days"

[tool.setuptools.packages.find]
include = ["physical_ai_evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples/notebooks"]  # Jupytext notebooks tolerate looser style

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # pytest.importorskip legitimately precedes imports

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E501",  # long lines in docstrings/comments are fine; ruff format handles code lines
  "E712",  # `success == False` is a Daft expression idiom, not a bool comparison
]

[tool.ty.rules]
# Heavy deps (libero/lerobot/transformers/robosuite/modal) are lazy optional imports by
# design and absent from the dev env. Warn, don't fail.
unresolved-import = "warn"
