site_name: physical-ai-evals
site_description: >-
  Evaluate OpenVLA and VLA-JEPA on LIBERO, LIBERO-Para, and LIBERO-Pro.
site_url: https://eventual-inc.github.io/physical-ai-evals/
repo_url: https://github.com/Eventual-Inc/physical-ai-evals
repo_name: Eventual-Inc/physical-ai-evals
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - Dataset readers: datasets.md
  - Evaluation protocol: evaluation.md
  - Troubleshooting: troubleshooting.md
