name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # gh-deploy pushes the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Deploy to GitHub Pages
        run: >-
          uvx --from mkdocs==1.6.1 --with mkdocs-material==9.7.6
          mkdocs gh-deploy --force --strict
