name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff@0.15.21 check .

  daft-example-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The runner has no GPU, so render in software.
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y libosmesa6
      - name: Install the example's script environment
        run: |
          uv sync --script examples/vla_jepa_libero_pro_daft.py
          PY=$(uv python find --script examples/vla_jepa_libero_pro_daft.py)
          uv pip install --python "$PY" pytest
          echo "PY=$PY" >> "$GITHUB_ENV"
      - run: '"$PY" -m pytest -v tests/test_vla_jepa_libero_pro_daft.py'
