name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Frozen lock agrees with project metadata
        run: make lock-check
      - name: Ruff
        run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install frozen development environment
        run: make setup
      - name: Type check
        run: make typecheck
      - name: Pytest
        run: make test

  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: MkDocs strict build
        run: make docs-build

  package:
    needs: [lint, test, docs-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Clean, build, and inspect distributions
        run: make build
      - name: Install wheel in a clean environment
        run: |
          uv venv /tmp/package-smoke --python 3.12
          uv pip install --python /tmp/package-smoke/bin/python dist/*.whl
          /tmp/package-smoke/bin/python -c "import physical_ai_evals, physical_ai_evals.schema; print(physical_ai_evals.__version__)"
          /tmp/package-smoke/bin/physical-ai-evals --help > /dev/null
